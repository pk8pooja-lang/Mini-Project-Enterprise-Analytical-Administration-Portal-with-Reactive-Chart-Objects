<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Needed so the page fits phones and tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit: customer analytics</title>

  <!-- Apply the saved theme before the page is drawn (no white flash in dark mode) -->
  <script>
    try {
      var saved = localStorage.getItem('orbit-theme');
      if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <a class="brand" href="#/">Orbit</a>
    <nav aria-label="Main menu">
      <a href="#/" data-page="dashboard">Dashboard</a>
      <a href="#/customers" data-page="customers">Customers</a>
      <a href="#/about" data-page="about">About</a>
    </nav>
    <button id="theme-btn" type="button">Dark mode</button>
  </header>

  <!-- Each page is drawn into this box by script.js -->
  <main id="view">
    <noscript><p>Please turn on JavaScript to use Orbit.</p></noscript>
  </main>

  <!-- Libraries, then our data, then our code -->
  <script src="libs/chart.umd.min.js"></script>
  <script src="libs/navigo.min.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
